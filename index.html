<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Sentiment Analysis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f7fa;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px 30px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #1a1a2e;
        }
        .subtitle {
            color: #6c757d;
            margin-bottom: 30px;
            font-size: 15px;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2d3748;
        }
        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .helper {
            font-size: 13px;
            color: #6c757d;
            margin-top: 4px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #4338ca;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .examples {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            font-size: 14px;
            color: #495057;
        }
        .examples code {
            background: #e9ecef;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Financial Sentiment Analysis</h1>
        <p class="subtitle">Enter a stock symbol to analyze sentiment and generate a report</p>

        <form id="analyzeForm" method="POST" action="/analyze">
            <div class="form-group">
                <label for="symbol">Stock Symbol</label>
                <input type="text" id="symbol" name="symbol" placeholder="e.g., MSFT (US), 0700.HK (HK), 000002.SZ (A-share)" required>
                <div class="helper">A-shares need .SS (Shanghai) or .SZ (Shenzhen) suffix</div>
            </div>
            <div class="form-group">
                <label for="period">Period</label>
                <select id="period" name="period">
                    <option value="1mo">1 Month</option>
                    <option value="3mo" selected>3 Months</option>
                    <option value="6mo">6 Months</option>
                    <option value="1y">1 Year</option>
                </select>
            </div>
            <div class="examples">
                💡 Examples: <code>MSFT</code> (Microsoft), <code>0700.HK</code> (Tencent), <code>000002.SZ</code> (China Vanke)
            </div>
            <button type="submit" class="btn" id="submitBtn">🚀 Analyze</button>
        </form>

        <div id="loading" style="display:none; text-align:center; margin-top:30px;">
            <div class="spinner"></div>
            <p style="color:#4f46e5; font-weight:500; margin-top:10px;">Analyzing, please wait…</p>
        </div>
    </div>

    <script>
        document.getElementById('analyzeForm').addEventListener('submit', function(e) {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Analyzing…';
            document.getElementById('loading').style.display = 'block';
        });
    </script>
</body>
</html>
